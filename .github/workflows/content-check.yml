name: Content checks

on:
  push:
    paths:
      - "**/*.md"
      - ".github/scripts/check-content.mjs"
      - ".github/workflows/content-check.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/scripts/check-content.mjs"
      - ".github/workflows/content-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Markdown structure and local links
        run: node .github/scripts/check-content.mjs
